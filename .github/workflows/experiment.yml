name: FactoryPulse research validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'factorypulse_experiment_v1/**'
      - '.github/workflows/experiment.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: factorypulse_experiment_v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests -v

      - name: Run CP-SAT smoke test
        run: python run_experiment.py --data data/mk01.txt --with-cpsat --limit 3 --out results/cpsat_ci_smoke.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorypulse-cpsat-results
          path: factorypulse_experiment_v1/results/cpsat_ci_smoke.json
          if-no-files-found: warn