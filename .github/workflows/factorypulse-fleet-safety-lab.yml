name: FactoryPulse Bounded Fleet Grid Safety Lab
on:
  push:
    paths:
      - 'factorypulse_experiment_v1/ai_swarm/fleet_safety_lab.py'
      - 'factorypulse_experiment_v1/tests/test_fleet_safety_lab.py'
      - '.github/workflows/factorypulse-fleet-safety-lab.yml'
  workflow_dispatch:
jobs:
  grid-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bounded grid invariants, 20 robot demo
        working-directory: factorypulse_experiment_v1
        run: python -m unittest discover -s tests -p test_fleet_safety_lab.py -v
      - name: Display bounded experiment (not physical validation)
        working-directory: factorypulse_experiment_v1
        run: python -c 'from ai_swarm.fleet_safety_lab import demonstration; print(demonstration())'
