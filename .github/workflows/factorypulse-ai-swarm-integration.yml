name: FactoryPulse Fleet Material CP-SAT Integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'factorypulse_experiment_v1/ai_swarm/**'
      - 'factorypulse_experiment_v1/tests/test_ai_swarm_integration.py'
      - '.github/workflows/factorypulse-ai-swarm-integration.yml'
  pull_request:
    paths:
      - 'factorypulse_experiment_v1/ai_swarm/**'
      - 'factorypulse_experiment_v1/tests/test_ai_swarm_integration.py'
      - '.github/workflows/factorypulse-ai-swarm-integration.yml'
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: factorypulse_experiment_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical, AI and solver dependencies
        run: python -m pip install -r requirements.txt scikit-learn==1.6.1 numpy==2.2.4
      - name: Run actual AMR to material to CP-SAT integration test
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p 'test_ai_swarm_integration.py' -v
      - name: Export independently audited integration artifact
        env:
          PYTHONPATH: src:.
        run: python -m ai_swarm.integration > integration_evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: factorypulse-amr-material-cpsat-integration
          path: factorypulse_experiment_v1/integration_evidence.json
