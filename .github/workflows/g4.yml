name: FactoryPulse G4 validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'factorypulse_experiment_v1/**'
      - '.github/workflows/g4.yml'
jobs:
  g4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: factorypulse_experiment_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test all baselines and invariants
        run: python -m unittest discover -s tests -v
      - name: Run all G4 cases
        run: python run_g4.py --data data/mk01.txt --out results/g4_36.json --time-limit 10
      - name: Upload raw result even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorypulse-g4-36
          path: factorypulse_experiment_v1/results/g4_36.json
          if-no-files-found: warn
