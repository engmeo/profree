name: FactoryPulse research validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'factorypulse_experiment_v1/**'
      - '.github/workflows/experiment.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: factorypulse_experiment_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Execute all 36 mk01 baseline cases (B1 and B2)
        run: python run_experiment.py --data data/mk01.txt --with-cpsat --out results/b1_b2_36.json
      - name: Summarize all pairs and fail on invalid schedules
        run: python summarize_b1_b2.py --input results/b1_b2_36.json --csv results/b1_b2_36_pairs.csv --summary results/b1_b2_36_summary.json
      - name: Upload complete raw evidence (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorypulse-b1-b2-all36-${{ github.run_id }}
          path: |
            factorypulse_experiment_v1/results/b1_b2_36.json
            factorypulse_experiment_v1/results/b1_b2_36_pairs.csv
            factorypulse_experiment_v1/results/b1_b2_36_summary.json
          if-no-files-found: warn
